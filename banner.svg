<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" role="img" aria-label="SEO Audit skill — one for every agent">
  <title>SEO Audit</title>
  <desc>Dot-matrix LED-display banner. Six tool icons on the right (Claude Code, Codex, Antigravity, Cursor, GitHub Copilot, OpenCode). Author Roshin Jose.</desc>
  <defs>
    <pattern id="dots" x="0" y="0" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="2.4" fill="#ffffff"/></pattern>
    <pattern id="dotsDim" x="0" y="0" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.4" fill="#1c2722"/></pattern>
    <mask id="dotMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1090" height="500"><rect x="0" y="0" width="1090" height="500" fill="url(#dots)"/></mask>
    <pattern id="scan" x="0" y="0" width="2" height="3" patternUnits="userSpaceOnUse"><rect x="0" y="0" width="2" height="1" fill="#000" opacity="0.35"/></pattern>
    <radialGradient id="vignette" cx="50%" cy="50%" r="75%"><stop offset="0%" stop-color="#0d0f0e" stop-opacity="0"/><stop offset="100%" stop-color="#000000" stop-opacity="0.65"/></radialGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="500" fill="#0a0d0c"/>
  <rect width="1600" height="500" fill="url(#dotsDim)"/>
  <g mask="url(#dotMask)" filter="url(#glow)">
    <text x="100" y="180" font-family="ui-monospace, 'JetBrains Mono', 'Menlo', monospace" font-size="108" font-weight="800" fill="#e8efe8" letter-spacing="3">SEO</text>
    <text x="100" y="305" font-family="ui-monospace, 'JetBrains Mono', 'Menlo', monospace" font-size="108" font-weight="800" fill="#3FE9C0" letter-spacing="3">AUDIT</text>
  </g>
  <text x="100" y="385" font-family="ui-monospace, 'JetBrains Mono', 'Menlo', monospace" font-size="30" font-weight="700" fill="#FF7A59" letter-spacing="3">SKILL · ONE FOR EVERY AGENT</text>
  <rect width="1600" height="500" fill="url(#scan)" opacity="0.35"/>
  <rect width="1600" height="500" fill="url(#vignette)"/>
  <line x1="1100" y1="40" x2="1100" y2="460" stroke="#1c2722" stroke-width="1"/>
  <g font-family="ui-monospace, 'JetBrains Mono', 'Menlo', monospace" font-size="14" fill="#9aa4a0" text-anchor="middle">
    <g transform="translate(1227, 110)"><g stroke="#e8efe8" stroke-width="3" stroke-linecap="round" fill="none"><line x1="0" y1="-30" x2="0" y2="30"/><line x1="-30" y1="0" x2="30" y2="0"/><line x1="-21" y1="-21" x2="21" y2="21"/><line x1="-21" y1="21" x2="21" y2="-21"/></g><circle cx="0" cy="0" r="4" fill="#e8efe8"/><text y="58" fill="#cfd6d2">Claude Code</text></g>
    <g transform="translate(1462, 110)"><g stroke="#e8efe8" stroke-width="3" fill="none" stroke-linecap="round"><path d="M -28 -2 a 22 22 0 0 1 44 0"/><path d="M 28 2 a 22 22 0 0 1 -44 0"/><path d="M -10 -22 a 14 14 0 0 1 28 18"/><path d="M 10 22 a 14 14 0 0 1 -28 -18"/></g><text y="58" fill="#cfd6d2">Codex</text></g>
    <g transform="translate(1227, 250)"><g stroke="#e8efe8" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M -24 26 L 0 -28 L 24 26"/><path d="M -14 8 L 14 8"/><path d="M -7 -22 L 0 -32 L 7 -22"/></g><text y="58" fill="#cfd6d2">Antigravity</text></g>
    <g transform="translate(1462, 250)"><g fill="#e8efe8" stroke="#0a0d0c" stroke-width="1.5" stroke-linejoin="round"><path d="M -16 -22 L 14 8 L 0 8 L 8 24 L 0 28 L -8 12 L -16 18 Z"/></g><text y="58" fill="#cfd6d2">Cursor</text></g>
    <g transform="translate(1227, 390)"><g stroke="#e8efe8" stroke-width="3" fill="none" stroke-linecap="round"><circle cx="-14" cy="2" r="11"/><circle cx="14" cy="2" r="11"/><line x1="-3" y1="2" x2="3" y2="2"/><line x1="-25" y1="-2" x2="-32" y2="-6"/><line x1="25" y1="-2" x2="32" y2="-6"/><line x1="-14" y1="-14" x2="-14" y2="-22"/><line x1="14" y1="-14" x2="14" y2="-22"/></g><text y="58" fill="#cfd6d2">GitHub Copilot</text></g>
    <g transform="translate(1462, 390)"><g stroke="#e8efe8" stroke-width="3" fill="none" stroke-linejoin="round"><path d="M 0 -26 L 26 -12 L 0 2 L -26 -12 Z"/><path d="M -26 -12 L -26 18 L 0 32 L 0 2"/><path d="M 26 -12 L 26 18 L 0 32"/></g><text y="58" fill="#cfd6d2">OpenCode</text></g>
  </g>
  <g transform="translate(80, 462)" font-family="ui-monospace, 'JetBrains Mono', 'Menlo', monospace">
    <g fill="#3FE9C0"><path d="M 0 -10 L 3 -3 L 10 -3 L 4 2 L 6 10 L 0 5 L -6 10 L -4 2 L -10 -3 L -3 -3 Z"/></g>
    <text x="20" y="5" font-size="20" fill="#3FE9C0" font-weight="700" letter-spacing="2">ROSHIN JOSE</text>
    <text x="20" y="26" font-size="13" fill="#5d6e68" letter-spacing="3">SKILL · SIX AGENTS · MIT</text>
  </g>
</svg>
